name: Sprint Qualifying Report

on:
  schedule:
    # Friday 20:00 UTC / Saturday 04:00 HK. Sprint qualifying runs on Friday.
    - cron: "0 20 * * 5"
  workflow_dispatch:
    inputs:
      year:
        description: "Season (leave blank to auto-detect the most recent session)"
        required: false
      round:
        description: "Country, circuit or location, e.g. Hungary (leave blank to auto-detect)"
        required: false
      lookback:
        description: "Hours to look back when auto-detecting (default 96)"
        required: false
      dry_run:
        description: "Build charts without posting"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and post sprint qualifying report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Inputs come in as environment variables rather than being pasted
          # into the script text. Nothing is quoted into a string and nothing
          # is eval'd, so values containing spaces (Sprint Qualifying, Las
          # Vegas) cannot break the command.
          IN_YEAR: ${{ github.event.inputs.year }}
          IN_ROUND: ${{ github.event.inputs.round }}
          IN_LOOKBACK: ${{ github.event.inputs.lookback }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=(--session "Sprint Qualifying")
          if [ -n "$IN_YEAR" ]; then
            ARGS+=(--year "$IN_YEAR")
          fi
          if [ -n "$IN_ROUND" ]; then
            ARGS+=(--round "$IN_ROUND")
          fi
          if [ -n "$IN_LOOKBACK" ]; then
            ARGS+=(--lookback "$IN_LOOKBACK")
          fi
          if [ "$IN_DRY" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "running: quali_report.py ${ARGS[@]}"
          python quali_report.py "${ARGS[@]}"

      - name: Upload charts as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint-qualifying-charts
          path: out/
          if-no-files-found: ignore
          retention-days: 14

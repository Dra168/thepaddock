name: Practice Report

on:
  schedule:
    # Two runs, one per practice day. The 22h default lookback is narrow enough
    # that the Saturday run cannot reach back into Friday's sessions.
    #
    #   Friday 21:00 UTC / Saturday 05:00 HK -- FP1 + FP2, or FP1 alone on a
    #   sprint weekend, in one post.
    - cron: "0 21 * * 5"
    #   Saturday 17:00 UTC / Sunday 01:00 HK -- FP3. On a sprint weekend there
    #   is no FP3, so this run finds nothing and exits quietly.
    - cron: "0 17 * * 6"
  workflow_dispatch:
    inputs:
      year:
        description: "Season (leave blank to auto-detect the most recent session)"
        required: false
      round:
        description: "Country, circuit or location, e.g. Hungary (leave blank to auto-detect)"
        required: false
      lookback:
        description: "Hours to look back when auto-detecting (default 22)"
        required: false
      dry_run:
        description: "Build charts without posting"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and post practice report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Inputs come in as environment variables rather than being pasted
          # into the script text. Nothing is quoted into a string and nothing
          # is eval'd, so values containing spaces (Sprint Qualifying, Las
          # Vegas) cannot break the command.
          IN_YEAR: ${{ github.event.inputs.year }}
          IN_ROUND: ${{ github.event.inputs.round }}
          IN_LOOKBACK: ${{ github.event.inputs.lookback }}
          IN_DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=()
          if [ -n "$IN_YEAR" ]; then
            ARGS+=(--year "$IN_YEAR")
          fi
          if [ -n "$IN_ROUND" ]; then
            ARGS+=(--round "$IN_ROUND")
          fi
          if [ -n "$IN_LOOKBACK" ]; then
            ARGS+=(--lookback "$IN_LOOKBACK")
          fi
          if [ "$IN_DRY" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "running: practice_report.py ${ARGS[@]}"
          python practice_report.py "${ARGS[@]}"

      - name: Upload charts as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-charts
          path: out/
          if-no-files-found: ignore
          retention-days: 14

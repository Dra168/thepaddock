name: Practice Report

on:
  schedule:
    # Two runs, one per practice day. The 22h default lookback is narrow enough
    # that the Saturday run cannot reach back into Friday's sessions.
    #
    #   Friday 21:00 UTC / Saturday 05:00 HK -- FP1 + FP2, or FP1 alone on a
    #   sprint weekend, in one post.
    - cron: "0 21 * * 5"
    #   Saturday 17:00 UTC / Sunday 01:00 HK -- FP3. On a sprint weekend there
    #   is no FP3, so this run finds nothing and exits quietly.
    - cron: "0 17 * * 6"
  workflow_dispatch:
    inputs:
      year:
        description: "Season (leave blank to auto-detect the most recent session)"
        required: false
      round:
        description: "Country, circuit or location, e.g. Hungary (leave blank to auto-detect)"
        required: false
      lookback:
        description: "Hours to look back when auto-detecting (default 22)"
        required: false
      dry_run:
        description: "Build charts without posting"
        type: boolean
        default: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build and post practice report
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.year }}" ]; then
            ARGS="$ARGS --year ${{ github.event.inputs.year }}"
          fi
          if [ -n "${{ github.event.inputs.round }}" ]; then
            ARGS="$ARGS --round '${{ github.event.inputs.round }}'"
          fi
          if [ -n "${{ github.event.inputs.lookback }}" ]; then
            ARGS="$ARGS --lookback ${{ github.event.inputs.lookback }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python practice_report.py $ARGS

      - name: Upload charts as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: practice-charts
          path: out/
          if-no-files-found: ignore
          retention-days: 14
